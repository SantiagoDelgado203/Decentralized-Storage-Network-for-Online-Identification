# =============================================================================
# Decentralized Storage Network - Docker Compose (Local Development)
# =============================================================================
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose logs -f            # View logs
#   docker-compose down               # Stop all services
# =============================================================================

services:
  # ===========================================================================
  # MongoDB - Storage for key fragments and user data
  # ===========================================================================
  mongodb:
    image: mongo:7
    container_name: mongodb
    networks:
      - dsn-network
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
  # ===========================================================================
  # Bootstrap Node - The first node that others connect to
  # ===========================================================================
  storage-bootstrap:
    build:
      context: ./StorageNode
      dockerfile: Dockerfile
    container_name: storage-bootstrap
    environment:
      - DSN_PORT=11111
      - DSN_NAMESPACE=dsn
      - DSN_DATA_DIR=/app/data
    volumes:
      - ./bootstrap-identity:/app/data:ro  # Read-only, use pre-generated identity
    networks:
      - dsn-network
    ports:
      - "11111:11111/tcp"
      - "11111:11111/udp"
    healthcheck:
      test: ["CMD", "pgrep", "storagenode"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # Storage Worker Nodes - Static peer IDs using DSN_NODE_SEED
  # ===========================================================================
  storage-node-1:
    build:
      context: ./StorageNode
      dockerfile: Dockerfile
    container_name: storage-node-1
    environment:
      - DSN_PORT=11111
      - DSN_NAMESPACE=dsn
      - DSN_DATA_DIR=/app/data
      - DSN_BOOTSTRAP_PEERS=/dns4/storage-bootstrap/tcp/11111/p2p/QmaTPiRLg64y6wwYXybwsQLVUqqzqwpJSNQ8k5T5e6MyAG
      - DSN_NODE_SEED=storage-node-1
      - MONGO_URI=mongodb://mongodb:27017
    healthcheck:
      test: ["CMD", "pgrep", "storagenode"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dsn-network
    depends_on:
      storage-bootstrap:
        condition: service_healthy
    restart: unless-stopped

  storage-node-2:
    build:
      context: ./StorageNode
      dockerfile: Dockerfile
    container_name: storage-node-2
    environment:
      - DSN_PORT=11111
      - DSN_NAMESPACE=dsn
      - DSN_DATA_DIR=/app/data
      - DSN_BOOTSTRAP_PEERS=/dns4/storage-bootstrap/tcp/11111/p2p/QmaTPiRLg64y6wwYXybwsQLVUqqzqwpJSNQ8k5T5e6MyAG
      - DSN_NODE_SEED=storage-node-2
      - MONGO_URI=mongodb://mongodb:27017
    healthcheck:
      test: ["CMD", "pgrep", "storagenode"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dsn-network
    depends_on:
      storage-bootstrap:
        condition: service_healthy
    restart: unless-stopped

  storage-node-3:
    build:
      context: ./StorageNode
      dockerfile: Dockerfile
    container_name: storage-node-3
    environment:
      - DSN_PORT=11111
      - DSN_NAMESPACE=dsn
      - DSN_DATA_DIR=/app/data
      - DSN_BOOTSTRAP_PEERS=/dns4/storage-bootstrap/tcp/11111/p2p/QmaTPiRLg64y6wwYXybwsQLVUqqzqwpJSNQ8k5T5e6MyAG
      - DSN_NODE_SEED=storage-node-3
      - MONGO_URI=mongodb://mongodb:27017
    healthcheck:
      test: ["CMD", "pgrep", "storagenode"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dsn-network
    depends_on:
      storage-bootstrap:
        condition: service_healthy
    restart: unless-stopped

  storage-node-4:
    build:
      context: ./StorageNode
      dockerfile: Dockerfile
    container_name: storage-node-4
    environment:
      - DSN_PORT=11111
      - DSN_NAMESPACE=dsn
      - DSN_DATA_DIR=/app/data
      - DSN_BOOTSTRAP_PEERS=/dns4/storage-bootstrap/tcp/11111/p2p/QmaTPiRLg64y6wwYXybwsQLVUqqzqwpJSNQ8k5T5e6MyAG
      - DSN_NODE_SEED=storage-node-4
      - MONGO_URI=mongodb://mongodb:27017
    healthcheck:
      test: ["CMD", "pgrep", "storagenode"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dsn-network
    depends_on:
      storage-bootstrap:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # Admin Node - API gateway for the network
  # ===========================================================================
  admin-node:
    build:
      context: ./AdminNode
      dockerfile: Dockerfile
    container_name: admin-node
    environment:
      - ADMIN_API_PORT=5000
      - ADMIN_P2P_PORT=4001
      - ADMIN_P2P_WS_PORT=4002
      - ADMIN_CORS_ORIGINS=http://localhost:3000,http://web-portal:3000
      - DSN_NAMESPACE=dsn
      - DSN_BOOTSTRAP_PEERS=/dns4/storage-bootstrap/tcp/11111/p2p/QmaTPiRLg64y6wwYXybwsQLVUqqzqwpJSNQ8k5T5e6MyAG
    networks:
      - dsn-network
    ports:
      - "5000:5000"     # API
      - "4001:4001"     # P2P TCP
      - "4002:4002"     # P2P WebSocket
    depends_on:
      storage-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # Web Portal - User-facing frontend
  # ===========================================================================
  web-portal:
    build:
      context: ./web-portal
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    container_name: web-portal
    networks:
      - dsn-network
    ports:
      - "3000:3000"
    depends_on:
      admin-node:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  dsn-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data:
